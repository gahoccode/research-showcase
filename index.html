.metric-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px; }

.metric-card .delta { font-size: 12px; margin-top: 2px; font-family: 'DM Mono', monospace; }
.metric-card .delta.up { color: var(--green); }
.metric-card .delta.down { color: var(--red); }
.insight { background: var(--bg2); border-left: 3px solid var(--text3); padding: 16px 20px; border-radius: 0 8px 8px 0; font-size: 14px; color: var(--text2); margin: 16px 0; line-height: 1.7; }

.flag.warn { background: var(--amber-bg); color: var(--amber-text); }
.flag.danger { background: var(--red-bg); color: var(--red-text); }
.flag.ok { background: var(--green-bg); color: var(--green-text); }

table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
th { background: var(--bg2); font-weight: 600; text-align: right; padding: 10px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-family: 'DM Mono', monospace; color: var(--text2); }

td { padding: 8px 12px; text-align: right; border-top: 1px solid var(--border); }
td:first-child { text-align: left; font-weight: 500; }
